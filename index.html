<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Plano Cartesiano 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; color: white; font-family: sans-serif; }
        canvas { display: block; }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(31, 41, 55, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 300px;
            border: 1px solid #374151;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Control de Dibujo 3D</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Coordenadas (X, Y, Z)</label>
                <div class="flex gap-2">
                    <input type="number" id="posX" value="0" step="0.5" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white">
                    <input type="number" id="posY" value="0" step="0.5" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white">
                    <input type="number" id="posZ" value="0" step="0.5" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white">
                </div>
            </div>

            <button onclick="addPoint()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded transition-colors">
                Agregar Punto
            </button>

            <button onclick="clearPoints()" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2 rounded transition-colors">
                Limpiar Todo
            </button>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-700">
            <p class="text-xs text-gray-400">Usa el ratón para rotar y la rueda para el zoom. Arrastra con el botón derecho para desplazar.</p>
        </div>
    </div>

    <div class="legend">
        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-red-500"></div> Eje X (Rojo)</div>
        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-green-500"></div> Eje Y (Verde)</div>
        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-blue-500"></div> Eje Z (Azul)</div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let points = [];

        function init() {
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controles de Órbita
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Ejes y Grid
            setupAxes();

            // Loop de animación
            animate();
        }

        function setupAxes() {
            // Grid principal (plano XZ)
            const size = 20;
            const divisions = 20;
            const gridHelper = new THREE.GridHelper(size, divisions, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Ejes (X: Rojo, Y: Verde, Z: Azul)
            const axesHelper = new THREE.AxesHelper(10);
            scene.add(axesHelper);
        }

        function addPoint() {
            const x = parseFloat(document.getElementById('posX').value);
            const y = parseFloat(document.getElementById('posY').value);
            const z = parseFloat(document.getElementById('posZ').value);

            if (isNaN(x) || isNaN(y) || isNaN(z)) return;

            // Crear esfera pequeña para el punto
            const geometry = new THREE.SphereGeometry(0.15, 16, 16);
            const material = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x333300 });
            const sphere = new THREE.Mesh(geometry, material);
            
            sphere.position.set(x, y, z);
            scene.add(sphere);
            points.push(sphere);

            // Dibujar línea si hay más de un punto (opcional para trazos)
            if (points.length > 1) {
                const prevPoint = points[points.length - 2].position;
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([prevPoint, sphere.position]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2 });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(line);
            }
        }

        function clearPoints() {
            // Eliminar objetos de la escena
            scene.children.slice().forEach(child => {
                if (child.type === "Mesh" || child.type === "Line") {
                    scene.remove(child);
                }
            });
            points = [];
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Ajustar ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>

</html>
